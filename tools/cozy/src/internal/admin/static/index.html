<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9ef"><title>Cozy Admin</title><link rel="icon" href="/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head><body><main class="shell"><header class="hero"><img class="mascot" src="/logo.svg" width="104" height="104" alt="A smiling little house wrapped in a warm blanket"><div><p class="eyebrow">YOUR LOCAL LITTLE NEIGHBORHOOD</p><h1>Everything’s cozy.</h1><p class="intro">A comfy home for your local services.</p></div><button id="refresh" class="secondary" type="button">↻ Refresh</button></header><section class="section"><div class="heading"><div><p class="eyebrow">RUNNING AT HOME</p><h2>Your services <span id="count" class="count">0</span></h2></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p></div><div id="sites" class="cards" aria-live="polite"><p class="empty">Checking in on the neighborhood…</p></div></section><section class="add-panel"><div><p class="eyebrow">MAKE SOME ROOM</p><h2>Invite a new service</h2><p class="intro">Give it a name and tell us how to start it.</p></div><form id="add-form"><label for="name">Service name</label><div class="name-field"><input id="name" name="name" required autocomplete="off" placeholder="my-project" pattern="[A-Za-z0-9][A-Za-z0-9.-]*"><span>.localhost</span></div><label for="run">Start command</label><input id="run" name="run" required autocomplete="off" placeholder="npm run dev -- --port $PORT"><button id="add-button" class="primary" type="submit">＋ Add to the neighborhood</button></form></section><footer>Made with warmth, right on localhost <span aria-hidden="true">♥</span></footer></main></body></html>
